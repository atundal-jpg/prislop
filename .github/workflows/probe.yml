name: probe

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Hvilket probe-script skal kjøres?"
        type: choice
        required: true
        default: probe_discover_counts.py
        options:
          - probe_brukas.py
          - probe_sportholding_sizefields.py
          - probe_esales_links.py
          - probe_foss.py
          - probe_olympia.py
          - probe_olympia_ajax.py
          - probe_olympia_bridge.py
          - probe_olympia_titles.py
          - probe_olympia_count.py
          - probe_olympia_sizeblocks.py
          - probe_olympia_dryrun.py
          - probe_olympia_priceblock.py
          - probe_oslosportslager.py
          - probe_oslosportslager_verify.py
          - probe_adidas.py
          - probe_brands.py
          - probe_bull_price.py
          - probe_bull_vendors.py
          - probe_bull_sku.py
          - probe_bull_code_source.py
          - probe_bull_discovery_drift.py
          - probe_bull_saucony_sweep.py
          - probe_bull_code_collision.py
          - probe_xxl_price.py
          - probe_xxl_facets.py
          - probe_xxl_esales.py
          - probe_xxl_jsonld_price.py
          - probe_xxl_nextdata_price.py
          - probe_xxl_group_dump.py
          - probe_discover_counts.py
      args:
        description: "Valgfrie argumenter til scriptet (f.eks. merke: hoka)"
        type: string
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Script og args går via env, ikke via ${{ }} rett i run: — ellers
      # interpoleres brukerstyrt input inn i shell-linja før den kjøres.
      - name: Kjør probe (${{ inputs.script }} ${{ inputs.args }})
        working-directory: scraper
        env:
          PROBE_SCRIPT: ${{ inputs.script }}
          PROBE_ARGS: ${{ inputs.args }}
        run: python "$PROBE_SCRIPT" $PROBE_ARGS
