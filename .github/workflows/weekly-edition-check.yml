name: weekly-edition-check

on:
  # PAUSET 28. september 2026 — prosjektet ligger på is. Se scrape.yml for
  # bakgrunn. workflow_dispatch står igjen, så den kan kjøres manuelt.
  # schedule:
  #   - cron: "0 8 * * 1"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer avhengigheter
        working-directory: scraper
        run: pip install -r requirements.txt
      - name: Sjekk sannsynlige edisjonshaler
        working-directory: scraper
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python check_potential_editions.py
